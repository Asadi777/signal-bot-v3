schema_version: data_source_matrix.v1
title: "Crypto Pre-Pump Project — Data Source Matrix v1 (partially populated)"
generated_note: >-
  Every row is UNKNOWN. No source may be promoted above UNKNOWN until the seven evidence items are
  actually collected, and none could be collected in the environment this file was written in: the
  session's egress policy refused CONNECT to data.binance.vision, api.binance.com and api.bybit.com,
  so no live documentation check, sample, depth check or rate-limit test was possible. The
  descriptive columns below therefore record what each row is *expected* to show and exactly how to
  verify it; they are not findings. Filling this in is the first task of the network-enabled run.

rows:
  # ---------------------------------------------------------------- OHLCV ----
  - domain: OHLCV
    provider: Binance
    product: Public data archive
    endpoint: "data.binance.vision /data/{spot|futures/um}/monthly/klines/{SYMBOL}/1m/*.zip"
    exchanges_chains: Binance spot and USDⓈ-M futures
    symbol_coverage: "Expected to include symbols no longer trading, which is the whole reason this row exists"
    historical_start: "UNVERIFIED — expected to vary per symbol and market"
    granularity: "1m and coarser"
    raw_backfill: "Yes — whole-month zipped CSV per symbol"
    event_time_quality: "Candle open/close from the exchange; unit has varied across dumps, so it is detected per file"
    available_at_reliability: "Derived from candle close, not measured. Archive publication lag is a property of our access path, not of when the market knew the value"
    ingested_at_capturable: "Yes, recorded by the pipeline"
    revisions_backfills: "UNVERIFIED — published SHA256 makes a silent revision detectable"
    rate_limits: "UNVERIFIED — static file host, expected to be far more permissive than the REST API"
    monthly_cost: "0"
    bulk_backfill_cost: "0 plus bandwidth"
    licensing_redistribution: "UNVERIFIED — internal research use expected to be fine, redistribution is not assumed"
    pit_suitability: "Expected good for closed candles; unusable for intra-candle availability questions"
    known_gaps:
      - "No candle is emitted for a minute with no trades; absence is not loss"
      - "Delisting and listing dates are not stated by the archive, only implied by file coverage"
    status: UNKNOWN
    verification_plan:
      - "Fetch one monthly file for a liquid symbol; confirm the published CHECKSUM matches"
      - "Confirm the CSV column layout and whether a header row is present, on files from at least three different years"
      - "Confirm the epoch unit of the time columns per market and per era"
      - "Walk the S3-style listing to establish per-symbol coverage start and end"
      - "Fetch one symbol believed delisted and confirm the archive still serves it"
      - "Read the terms of use and record redistribution rights verbatim"
    notes: "Chosen as the primary backfill path over the REST endpoint; see docs/decisions/0001."

  - domain: OHLCV
    provider: Binance
    product: REST klines
    endpoint: "GET /api/v3/klines, GET /fapi/v1/klines"
    exchanges_chains: Binance spot and USDⓈ-M futures
    symbol_coverage: "Live symbols only; delisted symbols expected to be absent"
    historical_start: "UNVERIFIED"
    granularity: "1m and coarser, 1000 candles per request"
    raw_backfill: "Possible but weight-limited; used for the current month and cross-checks only"
    event_time_quality: "Same candle semantics as the archive"
    available_at_reliability: "Derived from close; a measured available_at needs a live websocket collector, which is out of Phase 0A scope"
    ingested_at_capturable: "Yes"
    revisions_backfills: "UNVERIFIED"
    rate_limits: "Weight-based per IP, reported in X-MBX-USED-WEIGHT-1M; exact weights UNVERIFIED"
    monthly_cost: "0"
    bulk_backfill_cost: "0, but paid in time and ban risk"
    licensing_redistribution: "UNVERIFIED"
    pit_suitability: "Same as the archive for closed candles"
    known_gaps:
      - "Delisted symbols expected to be unreachable, which is why the archive leads"
    status: UNKNOWN
    verification_plan:
      - "Measure the actual weight cost of a 1000-candle request from the response headers"
      - "Compare one overlapping day against the archive and quantify any disagreement"
      - "Confirm behaviour for a delisted symbol (expected: an error, handled cleanly)"

  - domain: OHLCV
    provider: Bybit
    product: v5 market kline
    endpoint: "GET /v5/market/kline?category=spot|linear&interval=1"
    exchanges_chains: Bybit spot, linear and inverse
    symbol_coverage: "Live symbols"
    historical_start: "UNVERIFIED and suspected shallow for 1-minute data — this is the open question for Bybit"
    granularity: "1m and coarser, newest-first, 1000 per page"
    raw_backfill: "Depends entirely on the depth probe"
    event_time_quality: "Candle start only; close time is derived by us"
    available_at_reliability: "Derived from close"
    ingested_at_capturable: "Yes"
    revisions_backfills: "UNVERIFIED"
    rate_limits: "Per-IP limits, exact values UNVERIFIED"
    monthly_cost: "0"
    bulk_backfill_cost: "0"
    licensing_redistribution: "UNVERIFIED"
    pit_suitability: "Conditional on depth"
    known_gaps:
      - "No trade count and no taker-side split; those columns stay null rather than being invented"
    status: UNKNOWN
    verification_plan:
      - "Run `prepump probe-bybit-depth` and record the measured 1-minute depth as evidence"
      - "If depth is insufficient, evaluate the public trade-level archive and the cost of aggregating candles from it"
      - "Cross-check one overlapping day against Binance for the same token"

